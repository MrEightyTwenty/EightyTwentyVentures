<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Briefing · EightyTwentyVentures</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .article-wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 80px 24px 120px;
    }

    .article-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #555555;
      text-decoration: none;
      letter-spacing: 0.04em;
      margin-bottom: 52px;
      transition: color 0.15s;
    }
    .article-back:hover { color: #aaaaaa; }
    .article-back svg { width: 14px; height: 14px; }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #555555;
    }
    .article-meta .dot {
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #333333;
    }
    .article-category { color: #2dc89a; }

    .article-title {
      font-size: clamp(26px, 4vw, 40px);
      font-weight: 600;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin: 0 0 16px;
    }

    .article-subtitle {
      font-size: 18px;
      line-height: 1.6;
      color: #777777;
      margin: 0 0 48px;
      font-weight: 400;
    }

    .article-divider {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 0 0 48px;
    }

    /* Hero cover image */
    .article-hero {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border-radius: 4px;
      margin: 0 0 48px;
      background: #0e1311;
    }
    .article-hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Rendered markdown body */
    .article-body {
      font-size: 17px;
      line-height: 1.8;
      color: #cccccc;
    }
    .article-body p  { margin: 0 0 24px; }
    .article-body h2 {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      margin: 52px 0 16px;
      letter-spacing: -0.01em;
    }
    .article-body h3 {
      font-size: 18px;
      font-weight: 600;
      color: #ffffff;
      margin: 36px 0 12px;
    }
    .article-body strong { color: #ffffff; font-weight: 600; }
    .article-body em    { color: #aaaaaa; }
    .article-body a     { color: #2dc89a; text-decoration: none; }
    .article-body a:hover { text-decoration: underline; }
    .article-body ul,
    .article-body ol {
      margin: 0 0 24px 24px;
    }
    .article-body li { margin-bottom: 8px; }
    .article-body blockquote {
      border-left: 3px solid #2dc89a;
      margin: 32px 0;
      padding: 12px 24px;
      background: #111111;
      color: #aaaaaa;
      font-style: italic;
    }
    .article-body blockquote p { margin: 0; }
    .article-body hr {
      border: none;
      border-top: 1px solid #1e1e1e;
      margin: 48px 0;
    }
    .article-body code {
      font-family: 'Courier New', monospace;
      font-size: 14px;
      background: #1a1a1a;
      padding: 2px 6px;
      border-radius: 2px;
      color: #aaaaaa;
    }
    .article-body pre {
      background: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 4px;
      padding: 20px;
      overflow-x: auto;
      margin: 0 0 24px;
    }
    .article-body pre code { background: none; padding: 0; }

    /* Image and figure centering — overrides style.css */
    .article-body img {
      display: block !important;
      margin-left: auto !important;
      margin-right: auto !important;
      max-width: 100%;
      border-radius: 4px;
    }
    .article-body figure {
      margin: 40px 0;
      text-align: center;
    }
    .article-body figcaption {
      font-size: 13px;
      color: #888888;
      margin-top: 10px;
      font-style: italic;
    }

    /* Loading / error states */
    .article-state {
      padding: 80px 24px;
      text-align: center;
      color: #555555;
      font-size: 15px;
    }
    .article-state h2 { color: #ffffff; margin-bottom: 12px; font-size: 20px; }
  </style>
</head>
<body>

  <nav class="nav">
    <div class="nav-inner">
      <a href="index.html" class="nav-brand">Eighty<span>Twenty</span>Ventures</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="playbook.html">The Playbook</a></li>
        <li><a href="briefing.html" class="active">Briefing</a></li>
        <li><a href="faq.html">FAQ</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="index.html#subscribe" class="nav-cta">Subscribe</a></li>
      </ul>
      <button class="nav-toggle" aria-label="Toggle menu"
        onclick="document.getElementById('navLinks').classList.toggle('mobile-open')">&#9776;</button>
    </div>
  </nav>

  <!-- Content rendered here -->
  <div id="article-root"></div>

  <!-- marked.js for markdown rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>

  <script>
    (function () {
      'use strict';

      var KEY = 'etv_access';

      /* ── Auth gate ─────────────────────────────────────────────── */
      var authed = false;
      try { authed = !!localStorage.getItem(KEY); } catch (e) {}

      if (!authed) {
        window.location.replace('index.html');
        return;
      }

      /* ── Read slug from URL ─────────────────────────────────────── */
      var params = new URLSearchParams(window.location.search);
      var slug   = (params.get('slug') || '').trim();

      if (!slug) {
        renderError('No article specified.', 'Return to the briefings page to find the article you were looking for.');
        return;
      }

      /* ── Fetch markdown file ────────────────────────────────────── */
      fetch('content/briefings/' + slug + '.md')
        .then(function (res) {
          if (!res.ok) throw new Error('not found');
          return res.text();
        })
        .then(function (raw) {
          var parsed = parseFrontmatter(raw);
          renderArticle(parsed.data, parsed.content);
          setPageTitle(parsed.data.title);
        })
        .catch(function () {
          renderError(
            'Article not found.',
            'This briefing may have moved or been updated. Return to the briefings page.'
          );
        });

      /* ── Frontmatter parser ─────────────────────────────────────── */
      function parseFrontmatter (raw) {
        var match = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?([\s\S]*)$/);
        if (!match) return { data: {}, content: raw };

        var data = {};
        match[1].split('\n').forEach(function (line) {
          var idx = line.indexOf(':');
          if (idx === -1) return;
          var key = line.slice(0, idx).trim();
          var val = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
          data[key] = val;
        });

        return { data: data, content: match[2].trim() };
      }

      /* ── Date formatter ─────────────────────────────────────────── */
      function formatDate (str) {
        if (!str) return '';
        /* Append time to prevent UTC parsing from shifting the date by timezone offset */
        var d = new Date(str.includes('T') ? str : str + 'T00:00:00');
        if (isNaN(d.getTime())) return str;
        return d.toLocaleDateString('en-US', {
          year: 'numeric', month: 'long', day: 'numeric'
        });
      }

      /* ── Escape HTML ────────────────────────────────────────────── */
      function esc (s) {
        return String(s || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      /* ── Set page title ─────────────────────────────────────────── */
      function setPageTitle (title) {
        if (title) document.title = title + ' · EightyTwentyVentures';
      }

      /* ── Render full article ────────────────────────────────────── */
      function renderArticle (meta, body) {
        var html  = typeof marked !== 'undefined' ? marked.parse(body) : '<pre>' + esc(body) + '</pre>';
        var root  = document.getElementById('article-root');

        root.innerHTML =
          '<div class="article-wrap">' +
            '<a href="briefing.html" class="article-back">' +
              '<svg viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                '<path d="M9 2L4 7L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>' +
              '</svg>' +
              'All briefings' +
            '</a>' +

            '<div class="article-meta">' +
              (meta.category
                ? '<span class="article-category">' + esc(meta.category) + '</span><span class="dot"></span>'
                : '') +
              '<span>' + formatDate(meta.date) + '</span>' +
            '</div>' +

            '<h1 class="article-title">' + esc(meta.title || 'Untitled') + '</h1>' +

            (meta.subtitle
              ? '<p class="article-subtitle">' + esc(meta.subtitle) + '</p>'
              : '') +

            (meta.image
              ? '<div class="article-hero"><img src="' + esc(meta.image) + '" alt=""></div>'
              : '') +

            '<hr class="article-divider">' +

            '<div class="article-body">' + html + '</div>' +

          '</div>';
      }

      /* ── Render error state ─────────────────────────────────────── */
      function renderError (heading, message) {
        var root = document.getElementById('article-root');
        root.innerHTML =
          '<div class="article-state">' +
            '<h2>' + esc(heading) + '</h2>' +
            '<p>' + esc(message) + '</p>' +
            '<a href="briefing.html" style="color:#2dc89a;font-size:14px;">Back to briefings</a>' +
          '</div>';
      }

    })();
  </script>

  <script src="auth.js"></script>
</body>
</html>
