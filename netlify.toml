# =============================================================================
# Netlify Configuration — EightyTwentyVentures
# =============================================================================

[build]
  command = "node build.js"
  publish = "dist"

# Asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Feeds must never be cached hard, or Buttondown and Google see stale content
[[headers]]
  for = "/rss.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"
    Content-Type = "application/rss+xml; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Legacy article URLs. Anything already shared keeps working and passes
# its link equity to the new path.
[[redirects]]
  from = "/article.html"
  query = { slug = ":slug" }
  to = "/briefings/:slug/"
  status = 301
  force = true

# Pretty URLs
[[redirects]]
  from = "/playbook"
  to = "/playbook.html"
  status = 200

[[redirects]]
  from = "/playbook/intraday"
  to = "/playbook-intraday.html"
  status = 200

[[redirects]]
  from = "/playbook/position"
  to = "/playbook-position.html"
  status = 200

[[redirects]]
  from = "/briefing"
  to = "/briefing.html"
  status = 200

[[redirects]]
  from = "/briefings"
  to = "/briefing.html"
  status = 301

# Catch-all 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
