# =============================================================================
# Netlify Configuration — EightyTwentyVentures
# =============================================================================

[build]
  publish = "."

# Asset caching
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Pretty URLs (optional — lets /playbook resolve to /playbook.html)
[[redirects]]
  from = "/playbook"
  to = "/playbook.html"
  status = 200

[[redirects]]
  from = "/playbook/intraday"
  to = "/playbook-intraday.html"
  status = 200

[[redirects]]
  from = "/playbook/position"
  to = "/playbook-position.html"
  status = 200

[[redirects]]
  from = "/briefing"
  to = "/briefing.html"
  status = 200

# Catch-all 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
