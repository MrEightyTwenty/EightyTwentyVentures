<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verifying access — EightyTwentyVentures</title>
  <meta name="robots" content="noindex, nofollow">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a;
      color: #cccccc;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #111111;
      border: 1px solid #222222;
      border-radius: 4px;
      padding: 52px 44px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    .brand {
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #444444;
      margin-bottom: 36px;
    }

    /* Spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 2px solid #2a2a2a;
      border-top-color: #2dc89a;
      border-radius: 50%;
      margin: 0 auto 28px;
      animation: spin 0.75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Icon circles */
    .icon {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
    }
    .icon-success { background: rgba(45, 200, 154, 0.10); color: #2dc89a; }
    .icon-error   { background: rgba(220,  60,  60, 0.10); color: #dc3c3c; }

    h1 {
      font-size: 21px;
      font-weight: 600;
      color: #ffffff;
      margin-bottom: 12px;
      line-height: 1.3;
    }

    p {
      font-size: 14px;
      line-height: 1.65;
      color: #777777;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 13px 26px;
      background: #2dc89a;
      color: #000000;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      border-radius: 3px;
      letter-spacing: 0.01em;
    }

    .btn-ghost {
      background: none;
      color: #666666;
      border: 1px solid #2a2a2a;
      margin-top: 12px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="card">
    <p class="brand">EightyTwentyVentures</p>

    <!-- Loading -->
    <div id="state-loading">
      <div class="spinner"></div>
      <h1>Verifying your link</h1>
      <p>One moment.</p>
    </div>

    <!-- Success -->
    <div id="state-success" class="hidden">
      <div class="icon icon-success">&#10003;</div>
      <h1>You're in.</h1>
      <p>Access granted. Redirecting you now.</p>
      <a id="redirect-link" href="/briefings.html" class="btn">Continue</a>
    </div>

    <!-- Error -->
    <div id="state-error" class="hidden">
      <div class="icon icon-error">&#10005;</div>
      <h1 id="error-heading">Link expired</h1>
      <p id="error-body">This link is no longer valid. Request a new one from the homepage.</p>
      <a href="/" class="btn btn-ghost">Back to homepage</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var KEY             = 'etv_access';
      var VERIFY_ENDPOINT = '/.netlify/functions/verify-token';

      function show (stateId) {
        ['state-loading', 'state-success', 'state-error'].forEach(function (id) {
          var el = document.getElementById(id);
          if (el) el.classList.toggle('hidden', id !== stateId);
        });
      }

      function setRegistered (email) {
        try {
          localStorage.setItem(KEY, JSON.stringify({ email: email, ts: Date.now() }));
        } catch (e) {}
      }

      function setError (heading, body) {
        var h = document.getElementById('error-heading');
        var b = document.getElementById('error-body');
        if (h) h.textContent = heading;
        if (b) b.textContent = body;
        show('state-error');
      }

      /* ── Read URL params ──────────────────────────────────────── */
      var params   = new URLSearchParams(window.location.search);
      var email    = (params.get('email')    || '').trim();
      var token    = (params.get('token')    || '').trim();
      var redirect = (params.get('redirect') || '/briefings.html').trim();

      if (!email || !token) {
        setError(
          'Invalid link',
          'This link is missing required parameters. Please request a new one from the homepage.'
        );
        return;
      }

      /* ── Verify token ─────────────────────────────────────────── */
      fetch(VERIFY_ENDPOINT, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, token: token })
      })
      .then(function (res) {
        if (!res.ok) throw new Error('Network response was not ok');
        return res.json();
      })
      .then(function (data) {
        if (data.valid) {
          setRegistered(email);

          var link = document.getElementById('redirect-link');
          if (link) link.href = redirect;

          show('state-success');

          setTimeout(function () {
            window.location.href = redirect;
          }, 1500);

        } else {
          var msg = data.error || 'This link is no longer valid.';
          var expired = /expir/i.test(msg);
          setError(
            expired ? 'Link expired' : 'Invalid link',
            msg + (expired ? '' : ' Please request a new one from the homepage.')
          );
        }
      })
      .catch(function () {
        setError(
          'Something went wrong',
          'Unable to verify your link. Please return to the homepage and try again.'
        );
      });

    })();
  </script>

</body>
</html>
